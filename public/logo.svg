<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Filters for effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#shieldGradient)" opacity="0.1"/>
  
  <!-- Outer Shield -->
  <path d="M100 20 L160 45 L160 85 Q160 130 100 170 Q40 130 40 85 L40 45 Z" 
        fill="url(#shieldGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Inner Shield Highlight -->
  <path d="M100 30 L150 50 L150 85 Q150 120 100 155 Q50 120 50 85 L50 50 Z" 
        fill="url(#glowGradient)" 
        opacity="0.4"/>
  
  <!-- Fingerprint Pattern -->
  <g transform="translate(100, 75)" opacity="0.3">
    <!-- Fingerprint lines -->
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="none" stroke="white" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="none" stroke="white" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="26" fill="none" stroke="white" stroke-width="1.5"/>
    
    <!-- Fingerprint lines - broken pattern -->
    <path d="M -5 -15 Q -8 -10, -10 -5" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 5 -20 Q 10 -15, 12 -8" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Lock Body -->
  <rect x="85" y="100" width="30" height="35" rx="4" 
        fill="url(#lockGradient)" 
        filter="url(#glow)"/>
  
  <!-- Lock Shackle -->
  <path d="M 90 100 L 90 90 Q 90 80 100 80 Q 110 80 110 90 L 110 100" 
        fill="none" 
        stroke="url(#lockGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Lock Keyhole -->
  <circle cx="100" cy="115" r="4" fill="white" opacity="0.9"/>
  <rect x="98" y="115" width="4" height="8" rx="1" fill="white" opacity="0.9"/>
  
  <!-- Blockchain Nodes -->
  <g opacity="0.6">
    <!-- Node 1 -->
    <circle cx="65" cy="130" r="4" fill="#4ade80" filter="url(#glow)"/>
    <line x1="65" y1="130" x2="80" y2="120" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Node 2 -->
    <circle cx="80" cy="145" r="4" fill="#4ade80" filter="url(#glow)"/>
    <line x1="80" y1="145" x2="85" y2="135" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Node 3 -->
    <circle cx="120" cy="145" r="4" fill="#4ade80" filter="url(#glow)"/>
    <line x1="115" y1="135" x2="120" y2="145" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Node 4 -->
    <circle cx="135" cy="130" r="4" fill="#4ade80" filter="url(#glow)"/>
    <line x1="120" y1="120" x2="135" y2="130" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Security Dots Pattern -->
  <g opacity="0.2">
    <circle cx="70" cy="60" r="2" fill="white"/>
    <circle cx="80" cy="55" r="2" fill="white"/>
    <circle cx="120" cy="55" r="2" fill="white"/>
    <circle cx="130" cy="60" r="2" fill="white"/>
  </g>
  
  <!-- Tech Lines -->
  <g opacity="0.3" stroke="white" stroke-width="1" fill="none">
    <line x1="45" y1="95" x2="55" y2="95"/>
    <line x1="145" y1="95" x2="155" y2="95"/>
    <line x1="100" y1="25" x2="100" y2="35"/>
  </g>
</svg>